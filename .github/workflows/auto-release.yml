name: Auto Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - 'examples/**'
      - 'skills/**'
      - 'webdocs/**'
      - 'helm/**'
      - 'reports/**'
      - '*.md'
      - '.github/*.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: write

# Serialize runs so two pushes cannot race on the tag or the bump branch.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  auto-release:
    name: Auto Release
    runs-on: ubuntu-latest

    # Skip if commit message contains skip flags
    if: |
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, '[no release]') &&
      !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load release configuration
        id: config
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let config = {};
            try {
              const configPath = path.join(process.cwd(), '.github', 'release-config.yml');
              if (fs.existsSync(configPath)) {
                // For now, use a simple fallback approach
                // In production, you'd want proper YAML parsing
                config = {
                  project: { binary_name: 'aikit' },
                  auto_release: {
                    skip_labels: ['no-release'],
                    skip_commit_messages: ['[skip release]', '[no release]', '[skip ci]']
                  }
                };
              }
            } catch (e) {
              console.log('Config file not found or invalid, using defaults');
            }

            // Set outputs with fallback defaults
            core.setOutput('binary_name', config.project?.binary_name || 'aikit');
            core.setOutput('skip_labels', JSON.stringify(config.auto_release?.skip_labels || ['no-release']));
            core.setOutput('skip_messages', JSON.stringify(config.auto_release?.skip_commit_messages || ['[skip release]', '[no release]', '[skip ci]']));

      - name: Check for configured skip labels
        id: check-label
        env:
          SKIP_LABELS: ${{ steps.config.outputs.skip_labels }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fallback if config output was empty
          if [ -z "$SKIP_LABELS" ] || [ "$SKIP_LABELS" = "null" ]; then
            SKIP_LABELS='["no-release"]'
          fi

          # Get the PR number from the merge commit message
          PR_NUMBER=$(printf '%s' "$COMMIT_MSG" | grep -oP '#\K[0-9]+' | head -1 || echo "")

          if [ -n "$PR_NUMBER" ]; then
            echo "Found PR #$PR_NUMBER in commit message"

            # Check if PR has any of the configured skip labels
            LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' 2>/dev/null || echo "")

            while IFS= read -r label; do
              if printf '%s\n' "$LABELS" | grep -qxF -- "$label"; then
                echo "Found '$label' label on PR #$PR_NUMBER"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done < <(printf '%s' "$SKIP_LABELS" | jq -r '.[]')
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check for configured skip messages
        if: steps.check-label.outputs.skip != 'true'
        env:
          SKIP_MESSAGES: ${{ steps.config.outputs.skip_messages }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Fallback if config output was empty
          if [ -z "$SKIP_MESSAGES" ] || [ "$SKIP_MESSAGES" = "null" ]; then
            SKIP_MESSAGES='["[skip release]", "[no release]", "[skip ci]"]'
          fi

          # Check if commit message contains any configured skip messages.
          # Use grep -F to treat patterns as fixed strings (skip markers contain []).
          while IFS= read -r msg; do
            if printf '%s' "$COMMIT_MSG" | grep -qF -- "$msg"; then
              echo "Found skip message '$msg' in commit"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(printf '%s' "$SKIP_MESSAGES" | jq -r '.[]')

          echo "skip=false" >> "$GITHUB_OUTPUT"

      # main is protected, so this workflow never pushes to it. A push whose Cargo.toml
      # version is not tagged yet (a merged bump PR) is a release commit and gets tagged;
      # any other push opens or refreshes the bump PR for the next version.
      # See docs/releasing.md.
      - name: Classify pushed commit
        if: steps.check-label.outputs.skip != 'true'
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force

          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already tagged; this push is not a release commit"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is not tagged yet; tagging $GITHUB_SHA"
          fi

      - name: Tag release commit
        if: steps.check-label.outputs.skip != 'true' && steps.version.outputs.is_release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "::notice::Tagged $GITHUB_SHA as $TAG - Release runs via workflow_run"

      # PRs and pushes made with GITHUB_TOKEN do not trigger CI, so the bump PR would never
      # get its required checks. The GitHub App token does.
      - name: Generate GitHub App token
        if: steps.check-label.outputs.skip != 'true' && steps.version.outputs.is_release == 'false'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: goaikit
          repositories: aikit

      - name: Open or update version bump PR
        if: steps.check-label.outputs.skip != 'true' && steps.version.outputs.is_release == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: release/next-version
        run: |
          set -euo pipefail
          git fetch origin main --force

          # Bump from main's tip, not the pushed commit, so the PR never conflicts with main.
          MAIN_VERSION=$(git show origin/main:Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          if ! git rev-parse -q --verify "refs/tags/v$MAIN_VERSION" >/dev/null; then
            echo "::notice::main is at untagged version $MAIN_VERSION; its release is still pending, so no bump PR"
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$MAIN_VERSION"
          if ! [[ "$MAJOR.$MINOR.$PATCH" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot auto-bump non-semver version '$MAIN_VERSION'; bump Cargo.toml by hand"
            exit 1
          fi
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          TITLE="chore(release): bump version to $NEXT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH" origin/main
          sed -i "0,/^version = \".*\"$/s//version = \"$NEXT\"/" Cargo.toml
          git commit -am "$TITLE"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q "$REMOTE" "refs/heads/$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "$BRANCH already matches main + bump to $NEXT; not re-pushing"
          else
            git push --force "$REMOTE" "HEAD:refs/heads/$BRANCH"
          fi

          BODY=$(cat <<EOF
          Bumps \`Cargo.toml\` to \`$NEXT\`, opened by the Auto Release workflow.

          Merging this PR is what cuts the release: Auto Release tags the merge commit \`v$NEXT\`, and Release builds and publishes it from that tag.

          This branch is rebuilt from \`main\` on every push, so it stays mergeable. Do not add a CI or release skip marker to the merge commit message, or the release will not be tagged.
          EOF
          )

          PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body "$BODY"
            echo "::notice::Updated bump PR #$PR to $NEXT"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
            echo "::notice::Opened bump PR for $NEXT"
          fi

      - name: Skip notice
        if: steps.check-label.outputs.skip == 'true'
        run: |
          echo "::notice::Release skipped due to 'no-release' label on PR"
