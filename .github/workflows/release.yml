name: Release

# Publishes the GitHub release, binaries, and Homebrew/Scoop manifests for one version tag.
# See docs/releasing.md for the end-to-end flow.
#
# Invariants:
# - A release is built from the commit its tag points at, never from a branch head.
# - An already-published release is never deleted or replaced; the run fails instead.
# - A failed Auto Release run never produces a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.1); tag v<version> must already exist'
        required: true
        type: string
  workflow_run:
    workflows: ["Auto Release"]
    branches: [main]
    types:
      - completed

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest
    # Auto Release fails when it cannot tag or open its bump PR; that must never publish.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version input: '$INPUT_VERSION' (expected e.g. 0.1.197)"
              exit 1
            fi
            TAG="v$VERSION"
            if ! COMMIT=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
              echo "::error::Tag $TAG does not exist. Push the tag first (see docs/releasing.md)."
              exit 1
            fi
          else
            # Auto Release tags the pushed commit only when its Cargo.toml version is new.
            # Any other successful run (it opened a bump PR, or was skipped) releases nothing.
            VERSION=$(git show "$HEAD_SHA:Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
            TAG="v$VERSION"
            COMMIT=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
            if [ -z "$VERSION" ] || [ "$COMMIT" != "$HEAD_SHA" ]; then
              echo "::notice::$HEAD_SHA is not tagged $TAG, so Auto Release did not cut a release from it. Nothing to publish."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          CARGO_VERSION=$(git show "$COMMIT:Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          if [[ "$VERSION" == *"-"* ]]; then
            echo "Skipping Cargo.toml version check for pre-release tag: $VERSION"
          elif [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: tag $TAG points at $COMMIT whose Cargo.toml says '$CARGO_VERSION'"
            exit 1
          fi

          echo "Releasing $TAG from $COMMIT"
          {
            echo "release=true"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to replace a published release
        if: steps.resolve.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Fail before spending time on builds. Drafts are invisible to a read-only token;
          # create-release re-checks with write access right before publishing.
          if IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>gh-err.txt); then
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG is already published. Refusing to rebuild or replace it: its assets and the Homebrew/Scoop manifests pinned to them must not change under the same version. Release a new version instead."
              exit 1
            fi
          elif ! grep -qi 'not found' gh-err.txt; then
            cat gh-err.txt >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.os }} binary
    needs: verify-version
    if: needs.verify-version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary-name: aikit
            archive-format: tar.gz
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary-name: aikit
            archive-format: tar.gz
            use-cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary-name: aikit
            archive-format: zip
            use-cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            binary-name: aikit
            archive-format: tar.gz
            use-cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-version.outputs.commit }}

      - name: Build Rust binary
        uses: ./.github/actions/build-rust-binary
        with:
          target: ${{ matrix.target }}
          os: ${{ matrix.os }}
          binary_name: ${{ matrix.binary-name }}
          archive_format: ${{ matrix.archive-format }}
          use_cross: ${{ matrix.use-cross }}
          ref: ${{ needs.verify-version.outputs.commit }}

  collect-artifacts:
    name: Collect Release Artifacts
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    if: needs.verify-version.result == 'success'

    steps:
      - name: Download Linux GNU artifact
        uses: actions/download-artifact@v8
        with:
          name: aikit-x86_64-unknown-linux-gnu.tar.gz
          path: ./artifacts

      - name: Download Linux MUSL artifact
        uses: actions/download-artifact@v8
        with:
          name: aikit-x86_64-unknown-linux-musl.tar.gz
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: aikit-x86_64-pc-windows-msvc.zip
          path: ./artifacts

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: aikit-aarch64-apple-darwin.tar.gz
          path: ./artifacts

      - name: Verify required artifacts
        run: |
          REQUIRED=(
            "aikit-x86_64-unknown-linux-gnu.tar.gz"
            "aikit-x86_64-unknown-linux-musl.tar.gz"
            "aikit-x86_64-pc-windows-msvc.zip"
            "aikit-aarch64-apple-darwin.tar.gz"
          )

          for asset in "${REQUIRED[@]}"; do
            [ -f "./artifacts/$asset" ] || { echo "Missing required artifact: $asset"; exit 1; }
          done

      - name: Upload collected artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: ./artifacts
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [verify-version, collect-artifacts]
    runs-on: ubuntu-latest
    if: needs.verify-version.result == 'success' && needs.collect-artifacts.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.verify-version.outputs.commit }}

      - name: Download collected artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Prepare file list for release
        id: prepare-files
        run: |
          FILES=(
            "artifacts/aikit-x86_64-unknown-linux-gnu.tar.gz"
            "artifacts/aikit-x86_64-unknown-linux-musl.tar.gz"
            "artifacts/aikit-x86_64-pc-windows-msvc.zip"
            "artifacts/aikit-aarch64-apple-darwin.tar.gz"
          )

          for file in "${FILES[@]}"; do
            [ -f "$file" ] || { echo "Required release file missing: $file"; exit 1; }
          done

          {
            echo "files<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to replace a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-version.outputs.tag }}
          COMMIT: ${{ needs.verify-version.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$TAG_COMMIT" != "$COMMIT" ]; then
            echo "::error::Tag $TAG moved from $COMMIT to $TAG_COMMIT during this run; refusing to publish binaries built from $COMMIT."
            exit 1
          fi

          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>gh-err.txt); then
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Deleting leftover draft release $TAG from an earlier failed run"
              gh release delete "$TAG" --yes
            else
              echo "::error::Release $TAG is already published. Refusing to delete or replace it: its assets and the Homebrew/Scoop manifests pinned to them must not change under the same version. Release a new version instead."
              exit 1
            fi
          elif ! grep -qi 'not found' gh-err.txt; then
            cat gh-err.txt >&2
            exit 1
          fi

      - name: Generate release notes
        run: |
          VERSION="${{ needs.verify-version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD >> release_notes.md || echo "- Initial release" >> release_notes.md
          else
            echo "## Release $VERSION" >> release_notes.md
            echo "" >> release_notes.md
            echo "- Initial release" >> release_notes.md
          fi

          {
            echo ""
            echo "## Installation"
            echo ""
            echo "### Linux"
            echo "- aikit-x86_64-unknown-linux-gnu.tar.gz"
            echo "- aikit-x86_64-unknown-linux-musl.tar.gz"
            echo ""
            echo "### macOS"
            echo "- aikit-aarch64-apple-darwin.tar.gz"
            echo ""
            echo "### Windows"
            echo "- aikit-x86_64-pc-windows-msvc.zip"
          } >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify-version.outputs.tag }}
          name: Release ${{ needs.verify-version.outputs.version }}
          body_path: release_notes.md
          files: ${{ steps.prepare-files.outputs.files }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Publish release
        run: |
          TAG="${{ needs.verify-version.outputs.tag }}"
          gh release edit "$TAG" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-package-managers:
    name: Update Package Managers
    needs: [verify-version, create-release]
    runs-on: ubuntu-latest
    if: needs.create-release.result == 'success'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-version.outputs.commit }}

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: goaikit

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Checkout homebrew-cli repo
        uses: actions/checkout@v7
        with:
          repository: goaikit/homebrew-cli
          path: homebrew-cli
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout scoop-bucket repo
        uses: actions/checkout@v7
        with:
          repository: goaikit/scoop-bucket
          path: scoop-bucket
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate release metadata contract
        id: release-info
        run: |
          TAG="${{ needs.verify-version.outputs.tag }}"
          VERSION="${{ needs.verify-version.outputs.version }}"
          ASSETS=$(gh release view "$TAG" --repo ${{ github.repository }} --json assets --jq '.assets')

          required_assets=(
            "aikit-x86_64-unknown-linux-gnu.tar.gz"
            "aikit-x86_64-unknown-linux-musl.tar.gz"
            "aikit-x86_64-pc-windows-msvc.zip"
            "aikit-aarch64-apple-darwin.tar.gz"
          )

          for asset in "${required_assets[@]}"; do
            count=$(echo "$ASSETS" | jq -r --arg name "$asset" '[.[] | select(.name == $name)] | length')
            [ "$count" -eq 1 ] || { echo "Invalid asset count for $asset"; exit 1; }
            digest=$(echo "$ASSETS" | jq -r --arg name "$asset" '.[] | select(.name == $name) | .digest')
            [[ "$digest" == sha256:* ]] || { echo "Invalid digest for $asset: $digest"; exit 1; }
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Update Homebrew formula
        run: |
          cd homebrew-cli
          chmod +x generate_formula.sh
          VERSION="${{ steps.release-info.outputs.version }}"
          ./generate_formula.sh --version "$VERSION"

          grep -q "version \"$VERSION\"" Formula/aikit.rb || { echo "Formula version mismatch"; exit 1; }
          grep -q 'aikit-aarch64-apple-darwin.tar.gz' Formula/aikit.rb || { echo "Missing macOS arm64 URL"; exit 1; }
          grep -q 'aikit-x86_64-unknown-linux-gnu.tar.gz' Formula/aikit.rb || { echo "Missing Linux GNU URL"; exit 1; }
          grep -q 'aikit-x86_64-unknown-linux-musl.tar.gz' Formula/aikit.rb || { echo "Missing Linux MUSL URL"; exit 1; }
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Update Scoop bucket
        run: |
          cd scoop-bucket
          chmod +x generate_manifest.sh

          VERSION="${{ steps.release-info.outputs.version }}"
          ./generate_manifest.sh --version "$VERSION"

          jq -e ".version == \"$VERSION\"" bucket/aikit.json > /dev/null
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit and push Homebrew changes
        run: |
          cd homebrew-cli
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit for Homebrew"
          else
            git add Formula/aikit.rb README.md
            git commit -m "Update aikit to version ${{ steps.release-info.outputs.version }}"
            git push origin main
          fi

      - name: Commit and push Scoop changes
        run: |
          cd scoop-bucket
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit for Scoop"
          else
            git add bucket/aikit.json
            git commit -m "Update aikit to version ${{ steps.release-info.outputs.version }}"
            git push origin main
          fi
